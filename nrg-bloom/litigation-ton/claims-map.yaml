    forum_track: nigeria_primary
    status: needs_forum_review
    pleading_priority: high
    remedy_objective: Increase pressure by showing the exclusion was not accidental but affirmatively misrepresented.
    theory: TON represented to Axxela that NRG Bloom was aware of and aligned with a direct TON-Axxela structure when the record suggests the opposite.
