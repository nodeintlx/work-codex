    name: "Market Intelligence"
    purpose: "Turn trusted external developments into clear investor-relevant framing."
    audiences: ["energy infrastructure capital", "compute and AI investors", "analysts"]
    tone: "measured, data-first, non-hype"
    formats: ["thread", "market note", "founder post"]
    fact_ids:
      - "global_data_center_demand_doubles_2030"
      - "nigeria_power_access_and_losses"
      - "nigeria_grid_delivery_gap"
    notes: "This franchise should dominate during disclosure-constrained periods."
