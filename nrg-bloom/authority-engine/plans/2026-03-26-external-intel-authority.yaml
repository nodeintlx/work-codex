distribution_rules:
  - "At least one weekly piece should answer a named investor objection."
  - "At least one weekly piece should use a source from the watchlist published or checked recently."
  - "Do not publish more than one abstract founder-insight piece in a row without a hard fact-led piece."
  - "If a topic requires live-sensitive operating detail to be persuasive, do not force it into content."

founder_insight_rules:
  - "Talk about operating principles, not confidential counterparties."
  - "Translate field experience into lessons about logistics, uptime, remote execution, and trust."
  - "Avoid describing active disputes, live negotiations, or partner-sensitive specifics."
  - "Sound like an operator interpreting the market, not a victim narrating constraints."

weekly_lanes:
  - day: "Monday"
    lane: "market-intelligence"
    objective: "Own the market bottleneck discussion early in the week."
    output: "Founder post or thread"
    objection: "Why does this matter now?"
    objection_slug: "why_now"
  - day: "Wednesday"
    lane: "category-lineage"
    objective: "Make the category feel more legible than competitors make it."
    output: "LinkedIn company post or carousel"
    objection: "Is this category real or still mostly narrative?"
    objection_slug: "is_the_market_real"
  - day: "Friday"
    lane: "founder-conviction"
    objective: "Keep founder voice present with sanitized insight."
    output: "Founder note or market interpretation"
    objection: "Why should people listen to NRG Bloom?"
    objection_slug: "why_listen_to_nrg_bloom"
