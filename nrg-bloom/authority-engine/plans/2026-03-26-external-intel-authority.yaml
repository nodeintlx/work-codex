    name: "Founder Conviction"
    purpose: "Keep Makir's voice present without needing live-sensitive updates."
    audiences: ["Africa-focused capital", "founders", "operators"]
    tone: "direct, disciplined, insight-led"
    formats: ["Founder post", "founder note", "interview prompt"]
