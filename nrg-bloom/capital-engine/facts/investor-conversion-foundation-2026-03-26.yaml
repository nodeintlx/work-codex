        type: "internal_doc"
        authority: "internal"
        excerpt: "We design and deploy modular data centers for emerging markets — specifically containerized computing infrastructure powered by stranded gas and flare gas in West Africa."
      - path: "nrg-bloom/projects/oando/pathway-summary-1-pager-2026-02-26.md"
        type: "internal_doc"
        authority: "internal"
        excerpt: "NRG Bloom deploys modular data centers at Oando's upstream sites"

  - id: "global_flaring_2024_151bcm"
    claim: "The World Bank's 2025 tracker said global gas flaring reached 151 bcm in 2024."
    status: "verified"
    scope: "external"
    sources:
      - path: "World Bank gas flaring data portal"
        type: "official_dataset"
        authority: "institutional"
        title: "Global Gas Flaring Data"
        url: "https://www.worldbank.org/en/programs/gasflaringreduction/global-flaring-data"
        published_on: "2025-07-01"
        checked_on: "2026-03-26"
        excerpt: "Our estimates, derived from satellite data, show that 151 billion cubic meters (bcm) of associated gas was flared in 2024."
      - path: "World Bank 2025 tracker"
        type: "official_report"
        authority: "institutional"
        title: "2025 Global Gas Flaring Tracker Report"
        url: "https://www.worldbank.org/en/programs/gasflaringreduction/publication/2025-global-gas-flaring-tracker-report"
        published_on: "2025-07-01"
        checked_on: "2026-03-26"
        excerpt: "In 2024, flaring surged by 3 billion cubic meters (bcm) to 151 bcm, the highest level since 2007."
      - path: "World Bank explainer"
        type: "official_report"
        authority: "institutional"
        title: "What is Gas Flaring?"
        url: "https://www.worldbank.org/en/programs/gasflaringreduction/gas-flaring-explained"
        published_on: "2025-01-01"
        checked_on: "2026-03-26"
        excerpt: "The amount of gas currently flared each year – about 151 billion cubic meters (bcm)."

  - id: "africa_digital_economy_712b"
    claim: "Africa's digital economy is widely projected to reach about $712 billion by 2050."
    status: "verified"
    scope: "external"
    sources:
      - path: "IFC e-Conomy Africa 2020"
        type: "official_report"
        authority: "institutional"
        title: "e-Conomy Africa 2020 - Africa's $180 Billion Internet Economy Future"
        url: "https://www.ifc.org/en/insights-reports/2020/google-e-conomy"
        published_on: "2020-11-11"
        checked_on: "2026-03-26"
        excerpt: "By 2050, the projected potential contribution could reach $712 billion, 8.5% of the continent's GDP."
      - path: "IFC press release"
        type: "official_report"
        authority: "institutional"
        title: "New Google-IFC report estimates Africa’s Internet economy could be worth $180 billion by 2025"
        url: "https://www.ifc.org/en/pressroom/2020/new-google-ifc-report-estimates-africas-internet-economy-could-be-worth-180-billion-by-2025"
        published_on: "2020-11-11"
        checked_on: "2026-03-26"
        excerpt: "The projected potential contribution could reach $712 billion by 2050."
      - path: "African Development Bank speech"
        type: "multilateral"
        authority: "institutional"
        title: "Tilting Global Capital for Unlocking Investment Opportunities in Africa"
        url: "https://www.afdb.org/en/news-and-events/speeches/tilting-global-capital-unlocking-investment-opportunities-africa-keynote-speech-dr-akinwumi-adesina-standard-chartered-bank-africa-summit-july-31-2025-lagos-nigeria-85772"
        published_on: "2025-07-31"
        checked_on: "2026-03-26"
        excerpt: "The rapid expansion of the digital economy will add $180 billion to Africa’s GDP by 2025, and $712 billion by 2050."

  - id: "ngfcp_permits_2025"
    claim: "In December 2025, NUPRC said 28 firms received flare-gas permits under NGFCP, with 42 bidders awarded 49 flare sites."
    status: "verified"
    scope: "external"
    sources:
      - path: "NUPRC permit issuance release"
        type: "regulator"
        authority: "institutional"
        title: "NUPRC Issues Permit to 28 Firms for Flare Gas Utilisation, Projects $2bn Investments, 100,000 Jobs"
        url: "https://www.nuprc.gov.ng/nuprc-issues-permit-to-28-firms-for-flare-gas-utilisation-projects-2bn-investments-i00000-jobs/"
        published_on: "2025-12-15"
        checked_on: "2026-03-26"
        excerpt: "The Nigerian Upstream Petroleum Regulatory Commission has issued permits to access flare gas to 28 successful awardees. Forty-two successful bidders were awarded 49 flare sites."
      - path: "World Oil / Bloomberg coverage"
        type: "trusted_media"
        authority: "media"
        title: "Nigeria approves 28 firms to capture gas lost to flaring, targets $2 billion investment"
        url: "https://worldoil.com/news/2025/12/12/nigeria-approves-28-firms-to-capture-gas-lost-to-flaring-targets-2-billion-investment/"
        published_on: "2025-12-12"
        checked_on: "2026-03-26"
        excerpt: "Nigeria has granted permits to 28 firms. There were a total of 42 bids to harvest gas being flared at 49 sites in the Niger Delta region."
      - path: "Channels Television coverage"
        type: "trusted_media"
        authority: "media"
        title: "FG Issues 28 Gas Flare Commercialisation Permits, Eyes $2bn Investments, 100,000 Jobs"
        url: "https://www.channelstv.com/2025/12/13/fg-issues-28-gas-flare-commercialisation-permits-eyes-2bn-investments-100000-jobs/"
        published_on: "2025-12-13"
        checked_on: "2026-03-26"
        excerpt: "A total of 49 flare sites have been auctioned. Forty-two bidders have been awarded the sites."

  - id: "north_dakota_bakken_capture"
    claim: "North Dakota paired large Bakken associated-gas output with stronger capture policy, reaching a 94% gross capture rate in July 2024 ahead of a 91% target effective January 1, 2025."
    status: "verified"
    scope: "external"
    sources:
      - path: "North Dakota Pipeline Authority 2024 annual report"
        type: "official_report"
        authority: "institutional"
        title: "2024 Pipeline Authority Annual Report"
        url: "https://www.ndic.nd.gov/sites/www/files/documents/NDIC-Home/Publications/Pipeline-Authority-Annual-Reports/2024-PA-Annual-Report.pdf"
        published_on: "2025-12-01"
        checked_on: "2026-03-26"
        excerpt: "In July 2024, North Dakota's petroleum industry produced 3.46 billion cubic feet per day of natural gas, achieving a gross capture rate of 94%."
      - path: "North Dakota gas capture policy"
        type: "regulator"
        authority: "institutional"
        title: "Industrial Commission Amends Gas Capture Policy"
        url: "https://www.ndic.nd.gov/news/industrial-commission-amends-gas-capture-policy"
        published_on: "2018-11-20"
        checked_on: "2026-03-26"
        excerpt: "A final goal of 91 percent beginning Jan. 1, 2025."
      - path: "EIA associated gas production"
        type: "official_report"
        authority: "institutional"
        title: "U.S. associated natural gas production increased 6% in 2024"
        url: "https://www.eia.gov/todayinenergy/detail.php?id=66684"
        published_on: "2025-11-21"
        checked_on: "2026-03-26"
        excerpt: "In 2024, 67% of the Bakken's natural gas production came from associated gas. The Bakken produced 2.3 Bcf/d of associated gas."

  - id: "texas_permian_scale"
    claim: "Texas and the Permian are the core U.S. associated-gas frontier: Texas produced record gas in 2024 and the Permian accounted for most U.S. production growth."
    status: "verified"
    scope: "external"
    sources:
      - path: "EIA Texas profile"
        type: "official_report"
        authority: "institutional"
        title: "Texas State Energy Profile"
        url: "https://www.eia.gov/state/analysis.php?sid=TX"
        published_on: "2025-08-01"
        checked_on: "2026-03-26"
        excerpt: "In 2024, Texas accounted for 28% of the nation's natural gas gross withdrawals and produced a record 13 trillion cubic feet of natural gas gross withdrawals."
      - path: "EIA U.S. natural gas production remained flat in 2024"
        type: "official_report"
        authority: "institutional"
        title: "U.S. natural gas production remained flat in 2024"
        url: "https://www.eia.gov/todayinenergy/detail.php?id=65025"
        published_on: "2025-04-17"
        checked_on: "2026-03-26"
        excerpt: "In 2024, marketed natural gas production in the Permian rose by 12%, or 2.7 Bcf/d, to average 25.4 Bcf/d."
      - path: "EIA associated gas growth"
        type: "official_report"
        authority: "institutional"
        title: "U.S. associated natural gas production increased 6% in 2024"
        url: "https://www.eia.gov/todayinenergy/detail.php?id=66684"
        published_on: "2025-11-21"
        checked_on: "2026-03-26"
        excerpt: "Associated natural gas production in the Permian accounted for most of the growth in 2024, increasing 8% to 12.5 Bcf/d."

  - id: "crusoe_field_footprint_2025"
    claim: "By March 2025, Crusoe said its flare-gas business had deployed more than 425 modular data centers across seven U.S. states including North Dakota and Texas."
    status: "verified"
    scope: "external"
    sources:
      - path: "Crusoe / NYDIG transaction release"
        type: "company_release"
        authority: "company"
        title: "NYDIG to acquire Crusoe's bitcoin mining operation"
        url: "https://www.crusoe.ai/newsroom/nydig-to-acquire-crusoes-bitcoin-mining-operation-crusoe-to-scale-vertically"
        published_on: "2025-03-25"
        checked_on: "2026-03-26"
        excerpt: "It has deployed more than 425 modular data centers in the field across seven states, including North Dakota and Texas."
      - path: "CNBC coverage"
        type: "trusted_media"
        authority: "media"
        title: "Crusoe Energy sells bitcoin mining unit to NYDIG to focus on AI"
        url: "https://www.cnbc.com/2025/03/25/crusoe-energy-sells-bitcoin-mining-unit-to-nydig-to-focus-on-ai.html"
        published_on: "2025-03-25"
        checked_on: "2026-03-26"
        excerpt: "The deal includes Crusoe's technology that captures and converts flared gas from oil fields, and more than 425 modular data centers."
      - path: "Data Center Dynamics coverage"
        type: "trusted_media"
        authority: "media"
        title: "Crusoe exits crypto operations to focus on AI, sell business to NYDIG"
        url: "https://www.datacenterdynamics.com/en/news/crusoe-exits-crypto-operations-to-focus-on-ai-sell-business-to-nydig/"
        published_on: "2025-03-26"
        checked_on: "2026-03-26"
        excerpt: "Crusoe said it has deployed more than 425 modular data centers totaling more than 250MW across seven states in the US, including Texas and North Dakota."
