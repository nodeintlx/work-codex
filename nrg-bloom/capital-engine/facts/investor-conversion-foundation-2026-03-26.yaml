    status: "verified"
    scope: "internal"
    sources:
      - path: "nrg-bloom/projects/oando/pathway-summary-1-pager-2026-02-26.md"
        type: "internal_doc"
        authority: "internal"
        excerpt: "We have been operational at Ogboinbiri (Bayelsa State) since February 2025, proving this model works in the Niger Delta environment."
      - path: "nrg-bloom/projects/oando/intro-call-brief-2026-02-26.md"
        type: "internal_doc"
        authority: "internal"
        excerpt: "NRG Bloom has been operational at Ogboinbiri since Feb 2025 — over one year on-site"
      - path: "nrg-bloom/projects/oando/call-card-2026-03-06.md"
        type: "internal_doc"
        authority: "internal"
        excerpt: "We've been operating at Ogboinbiri since February 2025 — over 13 months, on Oando's own infrastructure."

  - id: "montreal_based_nigeria_operator"
