- id: miner_hpc_revenue_crossover_2026
  claim: TeraWulf's first-quarter 2026 results, released 8 May 2026, reported $34.0 million of total revenue
    made up of $21.0 million in HPC lease revenue and $13.0 million in bitcoin-mining revenue, the first
    quarter in which contracted compute hosting outearned mining at the company.
  status: verified
  scope: external
  sources:
  - path: SEC EDGAR filing archive
    type: official_report
    authority: institutional
    title: TeraWulf Reports First Quarter 2026 Results (Form 8-K exhibit)
    url: https://www.sec.gov/Archives/edgar/data/1083301/000108330126000083/a_wulfearningsreleaseq1202.htm
    published_on: '2026-05-08'
    checked_on: '2026-09-09'
    excerpt: Revenue of $34.0 million, including $21.0 million of HPC lease revenue and $13.0 million
      of digital asset revenue.
  - path: GlobeNewswire company release wire
    type: trusted_media
    authority: media
    title: TeraWulf Reports First Quarter 2026 Results
    url: https://www.globenewswire.com/news-release/2026/05/08/3290994/0/en/terawulf-reports-first-quarter-2026-results.html
    published_on: '2026-05-08'
    checked_on: '2026-09-09'
    excerpt: HPC lease revenue contributed $21.0 million in the period, representing the initial ramp
      of long-term customer agreements at Lake Mariner. We expect the business to be increasingly driven
      by recurring, contracted revenue, reducing exposure to the volatility historically associated with
      bitcoin mining.
  - path: crypto.news market coverage
    type: trusted_media
    authority: media
    title: TeraWulf's HPC revenue tops Bitcoin mining for first time as AI pivot accelerates
    url: https://crypto.news/terawulfs-hpc-revenue-tops-bitcoin-mining-for-first-time-as-ai-pivot-accelerates/
    published_on: '2026-05-08'
    checked_on: '2026-09-09'
    excerpt: HPC/AI hosting revenue of $21 million against under $13 million from bitcoin mining marks
      the first time HPC has overtaken Bitcoin as TeraWulf's primary revenue driver.
- id: powered_shell_repricing_2026
  claim: 'In 2026 the market began pricing Bitcoin miners on their power positions rather than their hashrate:
    Morgan Stanley research covered in July 2026 framed miners as owners of ''powered shell'' assets whose
    grid connections, land, and development pipelines can support long-term AI leases, and CleanSpark
    said in January 2026 it was assembling more than 890 MW of aggregate potential utility capacity in
    Texas for AI and high-performance computing workloads.'
  status: verified
  scope: external
  sources:
  - path: Investing.com market coverage
    type: trusted_media
    authority: media
    title: Morgan Stanley sees AI data center pivot unlocking upside for bitcoin miners
    url: https://www.investing.com/news/stock-market-news/morgan-stanley-sees-ai-data-center-pivot-unlocking-upside-for-bitcoin-miners-4809697
    published_on: '2026-07-23'
    checked_on: '2026-09-09'
    excerpt: Power has become the biggest bottleneck for AI infrastructure, making existing bitcoin mining
      sites attractive candidates for conversion; Morgan Stanley expects owners of 'powered shell' assets
      to command attractive lease economics as AI companies seek faster access to electricity.
  - path: Yahoo Finance syndication of the same research note
    type: trusted_media
    authority: media
    title: Morgan Stanley sees AI data center pivot unlocking upside for bitcoin miners
    url: https://finance.yahoo.com/technology/ai/articles/morgan-stanley-sees-ai-data-175347881.html
    published_on: '2026-07-23'
    checked_on: '2026-09-09'
    excerpt: Morgan Stanley initiated coverage on Hut 8, Riot Platforms and Applied Digital on the thesis
      that owners of 'powered shell' assets can command attractive lease economics as AI companies seek
      faster access to electricity.
  - path: CleanSpark investor relations release
    type: company_release
    authority: company
    title: CleanSpark Expands Texas Footprint with Major Power Acquisition Near Houston to Support Scaled
      AI and HPC Development
    url: https://investors.cleanspark.com/news/news-details/2026/CleanSpark-Expands-Texas-Footprint-with-Major-Power-Acquisition-Near-Houston-to-Support-Scaled-AI-and-HPC-Development/default.aspx
    published_on: '2026-01-14'
    checked_on: '2026-09-09'
    excerpt: More than 890 megawatts of aggregate potential utility capacity across both Houston-area
      sites, supporting large-scale, next-generation data center campuses designed for artificial intelligence
      and high-performance computing workloads.
