facts:
  - id: "alberta_gas_heavyweight"
    claim: "Official Canadian and Alberta sources describe Alberta as producing most of Canada's natural gas."
    status: "verified"
    scope: "external"
    sources:
      - path: "Canada Energy Regulator Alberta profile"
        type: "official_report"
        authority: "institutional"
        title: "Provincial and Territorial Energy Profiles - Alberta"
        url: "https://www.cer-rec.gc.ca/en/data-analysis/energy-markets/provincial-territorial-energy-profiles/provincial-territorial-energy-profiles-alberta.html"
        published_on: "2026-03-06"
        checked_on: "2026-03-26"
        excerpt: "In 2023, natural gas production in Alberta averaged 10.9 Bcf/d. Alberta produced 61% of Canada's total natural gas production in 2023."
      - path: "Alberta natural gas overview"
        type: "official_report"
        authority: "institutional"
        title: "Natural gas"
        url: "https://www.alberta.ca/natural-gas"
        published_on: "2026-03-01"
        checked_on: "2026-03-26"
        excerpt: "Alberta produces more than half of all the natural gas in Canada."
      - path: "Alberta natural gas vision"
        type: "official_report"
        authority: "institutional"
        title: "Natural gas vision and strategy"
        url: "https://www.alberta.ca/natural-gas-vision-and-strategy"
        published_on: "2026-02-01"
        checked_on: "2026-03-26"
        excerpt: "Canada is among the world's top 5 producers of natural gas, with about two-thirds of production coming from Alberta."
  - id: "north_dakota_bakken_capture"
    claim: "North Dakota paired large Bakken associated-gas output with stronger capture policy, reaching a 94% gross capture rate in July 2024 ahead of a 91% target effective January 1, 2025."
    status: "verified"
    scope: "external"
    sources:
      - path: "North Dakota Pipeline Authority 2024 annual report"
        type: "official_report"
        authority: "institutional"
        title: "2024 Pipeline Authority Annual Report"
        url: "https://www.ndic.nd.gov/sites/www/files/documents/NDIC-Home/Publications/Pipeline-Authority-Annual-Reports/2024-PA-Annual-Report.pdf"
        published_on: "2025-12-01"
        checked_on: "2026-03-26"
        excerpt: "In July 2024, North Dakota's petroleum industry produced 3.46 billion cubic feet per day of natural gas, achieving a gross capture rate of 94%."
      - path: "North Dakota gas capture policy"
        type: "regulator"
        authority: "institutional"
        title: "Industrial Commission Amends Gas Capture Policy"
        url: "https://www.ndic.nd.gov/news/industrial-commission-amends-gas-capture-policy"
        published_on: "2018-11-20"
        checked_on: "2026-03-26"
        excerpt: "A final goal of 91 percent beginning Jan. 1, 2025."
      - path: "EIA associated gas production"
        type: "official_report"
        authority: "institutional"
        title: "U.S. associated natural gas production increased 6% in 2024"
        url: "https://www.eia.gov/todayinenergy/detail.php?id=66684"
        published_on: "2025-11-21"
        checked_on: "2026-03-26"
        excerpt: "In 2024, 67% of the Bakken's natural gas production came from associated gas... The Bakken produced 2.3 Bcf/d of associated gas."
  - id: "texas_permian_scale"
    claim: "Texas and the Permian are the core U.S. associated-gas frontier: Texas produced record gas in 2024 and the Permian accounted for most U.S. production growth."
    status: "verified"
    scope: "external"
    sources:
      - path: "EIA Texas profile"
        type: "official_report"
        authority: "institutional"
        title: "Texas State Energy Profile"
        url: "https://www.eia.gov/state/analysis.php?sid=TX"
        published_on: "2025-08-01"
        checked_on: "2026-03-26"
        excerpt: "In 2024, Texas accounted for 28% of the nation's natural gas gross withdrawals... the state produced a record 13 trillion cubic feet of natural gas gross withdrawals."
      - path: "EIA U.S. natural gas production remained flat in 2024"
        type: "official_report"
        authority: "institutional"
        title: "U.S. natural gas production remained flat in 2024"
        url: "https://www.eia.gov/todayinenergy/detail.php?id=65025"
        published_on: "2025-04-17"
        checked_on: "2026-03-26"
        excerpt: "In 2024, marketed natural gas production in the Permian rose by 12%, or 2.7 Bcf/d, to average 25.4 Bcf/d."
      - path: "EIA associated gas growth"
        type: "official_report"
        authority: "institutional"
        title: "U.S. associated natural gas production increased 6% in 2024"
        url: "https://www.eia.gov/todayinenergy/detail.php?id=66684"
        published_on: "2025-11-21"
        checked_on: "2026-03-26"
        excerpt: "Associated natural gas production in the Permian region in oil-rich western Texas and southeastern New Mexico accounted for most of the growth in 2024, increasing 8% to 12.5 Bcf/d."
  - id: "crusoe_field_footprint_2025"
    claim: "By March 2025, Crusoe said its flare-gas business had deployed more than 425 modular data centers across seven U.S. states including North Dakota and Texas."
    status: "verified"
    scope: "external"
    sources:
      - path: "Crusoe / NYDIG transaction release"
        type: "company_release"
        authority: "company"
        title: "NYDIG to acquire Crusoe's bitcoin mining operation"
        url: "https://www.crusoe.ai/newsroom/nydig-to-acquire-crusoes-bitcoin-mining-operation-crusoe-to-scale-vertically"
        published_on: "2025-03-25"
        checked_on: "2026-03-26"
        excerpt: "It has deployed more than 425 modular data centers (250+ MWs) in the field across seven states... including North Dakota... Texas."
      - path: "CNBC coverage"
        type: "trusted_media"
        authority: "media"
        title: "Crusoe Energy sells bitcoin mining unit to NYDIG to focus on 'huge opportunity' in AI"
        url: "https://www.cnbc.com/2025/03/25/crusoe-energy-sells-bitcoin-mining-unit-to-nydig-to-focus-on-ai.html"
        published_on: "2025-03-25"
        checked_on: "2026-03-26"
        excerpt: "The deal includes Crusoe's technology that captures and converts flared gas from oil fields, and more than 425 modular data centers."
      - path: "Data Center Dynamics coverage"
        type: "trusted_media"
        authority: "media"
        title: "Crusoe exits crypto operations to focus on AI, sell business to NYDIG"
        url: "https://www.datacenterdynamics.com/en/news/crusoe-exits-crypto-operations-to-focus-on-ai-sell-business-to-nydig/"
        published_on: "2025-03-26"
        checked_on: "2026-03-26"
        excerpt: "Crusoe said it has deployed more than 425 modular data centers totaling more than 250MW across seven states in the US... including Texas and North Dakota."
  - id: "giga_texas_to_nd_flare_path"
    claim: "Public sources tie Giga's early modular build work to Texas and its flare-gas JV activity to North Dakota."
    status: "verified"
    scope: "external"
    sources:
      - path: "Giga company about page"
        type: "company_profile"
        authority: "company"
        title: "About Us - Giga Energy"
        url: "https://www.gigaenergy.com/about"
        published_on: "2026-03-01"
        checked_on: "2026-03-26"
        excerpt: "Back in 2019, Brent and Matt welded their first modular data centers in East Texas."
      - path: "Forbes profile"
        type: "trusted_media"
        authority: "media"
        title: "Giga Energy"
        url: "https://www.forbes.com/profile/giga-energy/"
        published_on: "2024-01-01"
        checked_on: "2026-03-26"
        excerpt: "Giga Energy... started in 2019 after directly witnessing the CO2 emissions and waste of natural gas from flaring around College Station, Texas."
      - path: "POWER Magazine release"
        type: "trusted_media"
        authority: "media"
        title: "Atlas Power and Giga Energy Announce a Joint Venture to Harness Stranded and Flare Gas for Bitcoin Mining"
        url: "https://www.powermag.com/press-releases/atlas-power-and-giga-energy-announce-a-joint-venture-to-harness-stranded-and-flare-gas-for-bitcoin-mining/"
        published_on: "2023-05-08"
        checked_on: "2026-03-26"
        excerpt: "Williston, North Dakota... a joint venture to utilize stranded and flare gas for bitcoin mining operations."
