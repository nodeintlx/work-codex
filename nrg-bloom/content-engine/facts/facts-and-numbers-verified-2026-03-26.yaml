  - id: "global_data_center_demand_doubles_2030"
    claim: "IEA analysis in 2025 said electricity demand from data centres worldwide is set to more than double by 2030 to around 945 TWh."
    status: "verified"
    scope: "external"
    sources:
      - path: "IEA Energy and AI executive summary"
        type: "official_report"
        authority: "institutional"
        title: "Executive summary - Energy and AI"
        url: "https://www.iea.org/reports/energy-and-ai/executive-summary"
        checked_on: "2026-03-26"
        excerpt: "Data centre electricity consumption is set to more than double to around 945 TWh by 2030."
      - path: "IEA Energy and AI report"
        type: "official_report"
        authority: "institutional"
        title: "Energy and AI"
        url: "https://www.iea.org/reports/energy-and-ai"
        checked_on: "2026-03-26"
        excerpt: "The report includes projections for how much electricity AI could consume over the next decade."
      - path: "IEA spotlight"
        type: "official_report"
        authority: "institutional"
        title: "The deepening ties between energy and AI"
        url: "https://www.iea.org/spotlights/the-deepening-ties-between-energy-and-ai"
        checked_on: "2026-03-26"
        excerpt: "The report projects that electricity demand from data centres worldwide is set to more than double by 2030 to around 945 terawatt-hours."

  - id: "nigeria_power_access_and_losses"
    claim: "Recent World Bank materials describe Nigeria as having the world's largest electricity access deficit, with roughly 85-90 million people lacking access and annual economic losses from poor power supply in roughly the $26-29 billion range."
    status: "verified"
    scope: "external"
    sources:
      - path: "World Bank press release"
        type: "multilateral"
        authority: "institutional"
        title: "The World Bank Approves Additional Financing to Consolidate the Gains of Nigeria's Power Sector Recovery Program"
        url: "https://www.worldbank.org/en/news/press-release/2023/06/09/the-world-bank-approves-additional-financing-to-consolidate-the-gains-of-nigeria-s-power-sector-recovery-program"
        published_on: "2023-06-09"
        checked_on: "2026-03-26"
        excerpt: "Lack of access to the electricity grid affects 45 percent of the population (90 million people), making Nigeria the country with the largest number of people not connected to electricity."
      - path: "World Bank DARES results brief"
        type: "multilateral"
        authority: "institutional"
        title: "Nigeria Distributed Access through Renewable Energy Scale-up (DARES) Program-for-Results"
        url: "https://documents.worldbank.org/en/publication/documents-reports/documentdetail/099082124112015103/p17968714b12670871924f3b6c5d0ff4d8"
        published_on: "2024-11-20"
        checked_on: "2026-03-26"
        excerpt: "About 85 million Nigerians do not have access to electricity and economic losses due to poor electricity supply are estimated at US$26.2 billion."
      - path: "World Bank PSRO press release"
        type: "multilateral"
        authority: "institutional"
        title: "Nigeria to Keep the Lights on and Power its Economy"
        url: "https://www.worldbank.org/en/news/press-release/2020/06/23/nigeria-to-keep-the-lights-on-and-power-its-economy"
        published_on: "2020-06-23"
        checked_on: "2026-03-26"
        excerpt: "About 47% of Nigerians do not have access to grid electricity... the economic cost of power shortages in Nigeria is estimated at around $28 billion."

  - id: "nigeria_grid_delivery_gap"
    claim: "Recent institutional analyses describe Nigeria's grid as delivering only roughly 3-5 GW on average despite materially higher installed or nominal capacity."
    status: "verified"
    scope: "external"
    sources:
      - path: "IEA Electricity 2025"
        type: "official_report"
        authority: "institutional"
        title: "Electricity 2025"
        url: "https://www.iea.org/reports/electricity-2025"
        checked_on: "2026-03-26"
        excerpt: "Nigeria’s installed generation capacity rose to 14 GW in 2024, but average daily available capacity was 4.14 GW."
      - path: "World Bank project document"
        type: "multilateral"
        authority: "institutional"
        title: "Nigeria Power Sector Guarantees Project"
        url: "https://documents1.worldbank.org/curated/en/193911617633470778/pdf/Nigeria-Power-Sector-Guarantees-Project.pdf"
        checked_on: "2026-03-26"
        excerpt: "The electricity produced and distributed within Nigeria hovers between 3 GW and 4 GW, peaking at 5 GW."
      - path: "African Development Bank project document"
        type: "multilateral"
        authority: "institutional"
        title: "Nigeria Electrification Project"
        url: "https://www.afdb.org/fileadmin/uploads/afdb/Documents/Project-and-Operations/PESR_NG_NIGERIA_ELECTRIFICATION_PROJECT_CORR_EN-final.pdf"
        checked_on: "2026-03-26"
        excerpt: "Nearly 14 GW... is generated through inefficient and costly generation solutions, showing how far real electricity demand outruns formal grid delivery."

  - id: "ngfcp_permits_power_potential_2025"
    claim: "By December 2025, NGFCP reporting said 28 firms had final flare-gas permits across 49 awarded sites, with 42 bidders involved, 250-300 mmscfd of gas to be captured, and nearly 3 GW of power potential."
    status: "verified"
    scope: "external"
    sources:
      - path: "NUPRC permit issuance release"
        type: "regulator"
        authority: "institutional"
        title: "NUPRC Issues Permit to 28 Firms for Flare Gas Utilisation, Projects $2bn Investments, 100,000 Jobs"
        url: "https://www.nuprc.gov.ng/nuprc-issues-permit-to-28-firms-for-flare-gas-utilisation-projects-2bn-investments-i00000-jobs/"
        published_on: "2025-12-15"
        checked_on: "2026-03-26"
        excerpt: "NUPRC has issued permits to access flare gas to 28 successful awardees under NGFCP."
      - path: "Channels Television coverage"
        type: "trusted_media"
        authority: "media"
        title: "FG Issues 28 Gas Flare Commercialisation Permits, Eyes $2bn Investments, 100,000 Jobs"
        url: "https://www.channelstv.com/2025/12/13/fg-issues-28-gas-flare-commercialisation-permits-eyes-2bn-investments-100000-jobs/"
        published_on: "2025-12-13"
        checked_on: "2026-03-26"
        excerpt: "A total of 49 flare sites have been auctioned. 42 bidders have been awarded the sites. Between 250 and 300 mmscfd of currently flared gas will be captured and commercialised."
      - path: "Bloomberg-sourced market coverage"
        type: "trusted_media"
        authority: "media"
        title: "Nigeria approves 28 firms to capture gas lost to flaring, targets $2 billion investment"
        url: "https://worldoil.com/news/2025/12/12/nigeria-approves-28-firms-to-capture-gas-lost-to-flaring-targets-2-billion-investment/"
        published_on: "2025-12-12"
        checked_on: "2026-03-26"
        excerpt: "The initiative is poised to attract between $2 billion and $3.5 billion of investment, and generate as much as 3 gigawatts of power."

  - id: "nigeria_data_center_capacity_pipeline_2025"
    claim: "2025 market-intelligence coverage described Nigeria's third-party data-center market as still relatively small, with figures around 65.8 MW live and about 327.8 MW under construction or planned."
    status: "verified"
    scope: "external"
    sources:
      - path: "GlobeNewswire / Research and Markets"
        type: "trusted_media"
        authority: "media"
        title: "Nigeria Data Center Market Investment & Growth Report 2026-2031"
        url: "https://www.globenewswire.com/news-release/2026/02/17/3238975/0/en/Nigeria-Data-Center-Market-Investment-Growth-Report-2026-2031-Featuring-Key-Investors-21st-Century-Technologies-Africa-Data-Centres-Digital-Realty-Equinix-MTN-Nxtra-Open-Access-Rac.html"
        published_on: "2026-02-17"
        checked_on: "2026-03-26"
        excerpt: "The market includes existing and upcoming facilities, with a still-limited current base and a meaningful planned pipeline."
      - path: "Arizton portfolio page"
        type: "industry_report"
        authority: "industry"
        title: "Nigeria Data Centers | Upcoming Data Centers Locations in Nigeria"
        url: "https://www.arizton.com/market-reports/nigeria-data-center-portfolio"
        checked_on: "2026-03-26"
        excerpt: "Nigeria's existing data center capacity stands at over 40 MW, while the upcoming capacity is projected to exceed 200 MW, representing an almost fivefold expansion."
      - path: "Real News Hub market summary"
        type: "trusted_media"
        authority: "media"
        title: "Nigeria's Data Center Market To Grow From $278 Million In 2024 To $671 Million By 2030"
        url: "https://realnewshub.com/nigerias-data-center-market-to-grow-from-278-million-in-2024-to-671-million-by-2030/"
        published_on: "2025-09-23"
        checked_on: "2026-03-26"
        excerpt: "The market is witnessing a boom in construction, with 327.8 MW of data center capacity under development as of December 2024, expected to increase the current 65.8 MW core and shell power capacity fivefold within the next 4-5 years."

