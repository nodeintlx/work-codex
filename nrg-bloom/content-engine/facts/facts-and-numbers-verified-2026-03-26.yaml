  - id: "crusoe_divestiture_2025"
    claim: "In March 2025, Crusoe said it sold its bitcoin-mining operation to NYDIG after deploying more than 425 modular data centers across seven U.S. states and Argentina."
    status: "verified"
    scope: "external"
    sources:
      - path: "Crusoe release"
        type: "company_release"
        authority: "company"
        title: "NYDIG to acquire Crusoe's bitcoin mining operation"
        url: "https://www.crusoe.ai/resources/newsroom/nydig-to-acquire-crusoes-bitcoin-mining-operation-crusoe-to-scale-vertically"
        published_on: "2025-03-25"
        checked_on: "2026-03-26"
        excerpt: "To date, it has deployed more than 425 modular data centers (250+ MWs) in the field across seven states and two countries... Moving forward, Crusoe will continue to grow and scale its AI infrastructure solutions."
      - path: "CNBC coverage"
        type: "trusted_media"
        authority: "media"
        title: "Crusoe sells bitcoin mining unit to NYDIG to focus on AI"
        url: "https://www.cnbc.com/2025/03/25/crusoe-energy-sells-bitcoin-mining-unit-to-nydig-to-focus-on-ai.html"
        published_on: "2025-03-25"
        checked_on: "2026-03-26"
        excerpt: "Crusoe is selling its bitcoin mining business to NYDIG as the company sharpens its focus on AI infrastructure."
      - path: "Data Center Dynamics"
        type: "trusted_media"
        authority: "media"
        title: "Crusoe exits crypto operations to focus on AI, sell business to NYDIG"
        url: "https://www.datacenterdynamics.com/en/news/crusoe-exits-crypto-operations-to-focus-on-ai-sell-business-to-nydig/"
        published_on: "2025-03-26"
        checked_on: "2026-03-26"
        excerpt: "Crusoe said it has deployed more than 425 modular data centers totaling more than 250MW across seven states in the US and Argentina."
