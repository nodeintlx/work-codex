  - slug: "ngfcp-governed-market"
    title: "NGFCP Turned Flare Monetization Into a Governed Market"
    publish_day: "Wednesday"
    archetype: "category-authority"
    pillar: "flare-gas"
    target_channel: "linkedin-company"
    audience:
      - "upstream energy partners"
      - "infrastructure funds"
      - "industry validators"
    hero_stat: "By December 2025, NGFCP reporting pointed to 28 final permits, 49 awarded sites, and nearly 3 GW of power potential."
    hook: "Flare-gas compute in Nigeria should not be framed like a fringe experiment anymore."
    thesis: "This is what category formation looks like: regulation, public projects, and analogs that make the market easier to underwrite."
    proof_points:
      - "NGFCP gives flare monetization a more legible commercial frame than most outsiders realize."
      - "Green Flare's 53 MW announcement shows the Nigerian market is already attracting visible build-outs."
      - "Crusoe's exit matters because it shows the model was real enough to become part of a larger power-and-compute story."
    contrarian_take: "The interesting question is not whether flare-to-compute is real. It is which African operators investors will trust once the market becomes legible."
    call_to_action: "NRG Bloom intends to be read as one of those operators, not as a spectator."
    discussion_question: "What gives investors more conviction in stranded-gas compute: regulation, basin economics, or proven field execution?"
    quote: "A category becomes investable when regulation and operating proof finally start to line up."
    quote_highlights:
      - "investable"
      - "align"
    video_hook: "NGFCP changed the conversation. This is no longer a vague flare-gas story."
    video_close: "The market is getting easier to read. The next question is who earns the right to lead it."
