  - slug: "undersupplied-digital-infrastructure"
    title: "Nigeria Is Growing Data Centers, But the Market Is Still Small Enough for Edge Operators to Matter"
    publish_day: "Friday"
    archetype: "market-gap"
    pillar: "digital-infrastructure"
    target_channel: "x-thread"
    audience:
      - "digital infrastructure investors"
      - "founders"
      - "market analysts"
    hero_stat: "Market coverage in 2025 said Nigeria had about 65.8 MW of third-party data-centre capacity and about 327.8 MW more in the pipeline."
    hook: "Nigeria's data-centre story is real. The more useful point is how early the market still is."
    thesis: "The market is no longer empty, but it is still early enough for disciplined edge operators to matter."
    proof_points:
      - "The capacity online today is still small relative to the country's digital demand and power constraints."
      - "Pipeline growth is real, but more campuses do not eliminate stranded-energy problems."
      - "NRG Bloom's 1.5 MW operating proof matters because this market will not be won only by the biggest site. It will also be won by operators who can deploy where energy already exists."
    contrarian_take: "The mistake is assuming the whole market resolves into hyperscale campuses. Early markets usually reward the teams that solve the awkward parts first."
    call_to_action: "That is the part of the market NRG Bloom cares about: where energy realism and modular execution still create edge."
    discussion_question: "As Nigeria's data-centre market matures, where will the most defensible value sit: hyperscale campuses, modular edge deployments, or the link between the two?"
    quote: "Early markets reward the operator who solves the awkward part first."
    quote_highlights:
      - "reward"
      - "missing"
    video_hook: "Nigeria's data-centre market is growing, but it is still early enough for edge operators to matter."
    video_close: "The companies that understand both centralized demand and edge energy constraints will shape what gets built next."
