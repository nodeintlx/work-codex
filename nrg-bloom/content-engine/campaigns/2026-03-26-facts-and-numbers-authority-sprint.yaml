briefs:
  - slug: "energy-delivery-bottleneck"
    title: "The Constraint Is Not Demand. It Is Energy Delivery."
    publish_day: "Monday"
    archetype: "market-thesis"
    pillar: "energy-and-compute"
    target_channel: "linkedin-founder"
    audience:
      - "infrastructure investors"
      - "power-sector operators"
      - "AI compute investors"
    hero_stat: "IEA says data-centre electricity demand could more than double by 2030. World Bank materials still describe Nigeria as having the world's largest electricity-access deficit."
    hook: "Most people still talk about African compute as a demand story. That misses the real problem."
    thesis: "The hard part is not whether demand exists. The hard part is whether energy can actually be delivered where compute can use it."
    proof_points:
      - "Compute is moving into a period where electricity availability matters more than slideware."
      - "Nigeria forces you to separate energy supply from energy delivery. They are not the same thing."
      - "NRG Bloom's model matters because it goes to trapped or wasted energy instead of waiting for the grid to behave."
    contrarian_take: "The market does not need another polished Africa data-centre narrative. It needs people who understand that if power cannot be delivered, compute does not happen."
    call_to_action: "That is the layer NRG Bloom is building around: where stranded energy, modular infrastructure, and real compute demand finally meet."
    discussion_question: "In the next wave of compute infrastructure, what matters more: customer demand or usable energy at the point of deployment?"
    quote: "If power cannot be delivered, compute does not happen."
    quote_highlights:
      - "constrained"
      - "energy"
    video_hook: "If your compute thesis ignores energy delivery, it is missing the bottleneck."
    video_close: "The winners in this market will be the teams that know where energy can actually be turned into compute."
    hashtags:
      - "#NRGBloom"
      - "#DigitalInfrastructure"
      - "#EnergyEdge"
      - "#AfricaTech"
      - "#DataCenters"
