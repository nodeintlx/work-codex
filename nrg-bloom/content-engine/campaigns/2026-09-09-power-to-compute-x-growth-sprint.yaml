  - slug: "ngfcp-permit-market"
    title: "Nigeria Turned Flared Gas Into a Permit Market. Compute Barely Noticed."
    publish_day: "Wednesday (week 2)"
    archetype: "category-authority"
    pillar: "flare-gas"
    target_channel: "x-thread"
    audience:
      - "energy X"
      - "bitcoin mining X"
      - "upstream energy partners"
    hero_stat: "28 firms hold final NGFCP permits across 49 awarded flare sites, covering 250 to 300 mmscfd of gas and close to 3 GW of power potential."
    hook: "There is a country where close to 3 GW of power is sitting inside permitted, already-burning gas, and the AI buildout is not even looking at it."
    thesis: "Flare-gas compute in Nigeria is not a pilot idea anymore. It is an auctioned, permitted market with named counterparties and a regulator that publishes the numbers."
    proof_points:
      - "NUPRC ran an auction. 42 bidders won 49 sites. In December 2025 it issued permits to 28 firms. That is procurement, not speculation."
      - "The world flared 151 billion cubic meters of gas in 2024, the highest level since 2007. Nigeria is a significant contributor, and those molecules are already at surface."
      - "Flare gas is the one fuel where the alternative use is combustion into the sky. That is what makes the delivered power cost structurally low rather than temporarily low."
    contrarian_take: "Everyone chasing AI power is fighting over queue positions on congested grids. The uncontested megawatts are in the basins nobody wants to fly to."
    call_to_action: "NRG Bloom builds containerized compute at the flare, in Bayelsa State, and has been doing it since February 2025."
    discussion_question: "What actually caps flare-gas compute in Nigeria: capital, regulation, or the shortage of operators willing to live on site?"
    quote: "The uncontested megawatts are in the basins nobody wants to fly to."
    quote_highlights:
      - "uncontested"
      - "basins"
    video_hook: "Nigeria auctioned 49 flare sites. The AI industry did not notice."
    video_close: "Permitted gas, already burning, close to three gigawatts of potential. That is a market, not a thesis."
    hashtags:
      - "#NGFCP"
      - "#FlareGas"
      - "#Nigeria"
      - "#Bitcoin"
      - "#DataCenters"
      - "#NRGBloom"
    fact_ids:
