  - slug: "ogboinbiri-operating-proof"
    title: "Everyone Has a 100 MW Announcement. Very Few Have a Running Site."
    publish_day: "Friday (week 2)"
    archetype: "operator-proof"
    pillar: "remote-ops-notebook"
    target_channel: "x-thread"
    audience:
      - "bitcoin mining X"
      - "africa tech X"
      - "infrastructure skeptics"
    hero_stat: "1.5 MW operational at Ogboinbiri in Bayelsa State since February 2025. Not announced, not permitted, not planned. Running."
    hook: "Everyone in this category has a 100 MW announcement. Almost nobody has a site where a human being has to physically show up on a Sunday because a genset tripped."
    thesis: "In frontier power, the only number that predicts whether you can build the next 50 MW is whether you already survived the first one."
    proof_points:
      - "NRG Bloom has been operational at Ogboinbiri in Bayelsa State since February 2025, at 1.5 MW."
      - "The model is containerized on purpose. Remote Niger Delta sites do not forgive stick-built construction schedules."
      - "Nigeria's whole third-party data center base was reported around 65.8 MW live with roughly 327.8 MW in the pipeline. The market is still small enough that operating proof is a real edge."
    contrarian_take: "Announced capacity in this sector is a marketing number. Energized capacity is a competence number. The distance between the two is where most of these projects quietly die."
    call_to_action: "If you want to know whether an operator can handle the Niger Delta, ask what broke in month four and who fixed it."
    discussion_question: "In frontier infrastructure, what should carry more weight: contracted pipeline, or months of continuous uptime on a genuinely hard site?"
    quote: "Announced capacity is a marketing number. Energized capacity is a competence number."
    quote_highlights:
      - "marketing"
      - "competence"
    video_hook: "Everyone has a 100 MW announcement. Very few have a running site."
    video_close: "Energized beats announced. Every single time."
    hashtags:
      - "#Nigeria"
      - "#Bitcoin"
      - "#Mining"
      - "#DataCenters"
      - "#Infrastructure"
      - "#NRGBloom"
