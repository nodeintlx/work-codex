  - slug: "who-actually-has-the-power"
    title: "The AI Buildout Became a Land Grab for Energized Sites. Africa Is Not in the Auction."
    publish_day: "Tuesday (week 3)"
    archetype: "market-gap"
    pillar: "digital-infrastructure"
    target_channel: "x-thread"
    audience:
      - "AI and compute X"
      - "africa focused capital"
      - "market analysts"
    hero_stat: "IEA expects data centre electricity demand to more than double by 2030 to around 945 TWh. Africa's digital economy is projected near $712 billion by 2050. Those two lines do not currently meet anywhere."
    hook: "The AI buildout has quietly turned into a global land grab for anything with a power connection. The cheapest energized land on the planet is in places the auction has not reached yet."
    thesis: "Compute follows power, and power arbitrage is the most durable edge in this cycle. The arbitrage is widest exactly where the energy is trapped."
    proof_points:
      - "The IEA projects global data centre electricity demand more than doubling by 2030 to roughly 945 TWh. That demand has to physically land somewhere with power."
      - "Africa's digital economy is projected around $712 billion by 2050, yet Nigeria's third-party data centre base was reported near 65.8 MW live in 2025."
      - "Capital is competing hard for scarce energized sites in mature markets while permitted, already-flowing gas sits unmonetized in the Niger Delta."
    contrarian_take: "Frontier markets are not a discount version of this trade. They are the only place left where you can still buy the input cheap, and the reason it looks risky is that almost nobody has operated there."
    call_to_action: "NRG Bloom is building the operating record that makes those megawatts financeable to somebody other than a miner."
    discussion_question: "How many years until a hyperscaler signs its first African stranded-power lease, and what has to be true before that happens?"
    quote: "Compute follows power. The arbitrage is widest where the energy is trapped."
    quote_highlights:
      - "follows"
      - "trapped"
    video_hook: "The AI buildout became a land grab for energized sites."
    video_close: "The cheapest megawatts on earth are still sitting in a basin, on fire."
