  - slug: "africa-power-myth"
    title: "Nigeria Does Not Have a Power Shortage. It Has a Delivery Problem."
    publish_day: "Thursday (week 1)"
    archetype: "myth-teardown"
    pillar: "africa-infrastructure-myths"
    target_channel: "x-thread"
    audience:
      - "africa tech X"
      - "energy X"
      - "AI datacenter skeptics"
    hero_stat: "14 GW of installed capacity in Nigeria. Roughly 4 GW actually delivered on an average day. The gap is not fuel. It is everything between the turbine and the socket."
    hook: "The lazy take is that Africa cannot power data centers. The real story is narrower and far more useful: Nigeria cannot move power, which is a completely different problem if you are willing to build at the source."
    thesis: "Site the compute at the source and the transmission failure that defines Nigerian power stops being your risk and starts being your discount."
    proof_points:
      - "The IEA put Nigeria's installed generation capacity at 14 GW in 2024 with average daily available capacity of 4.14 GW. That is a delivery failure, not a fuel failure."
      - "World Bank materials put roughly 85 to 90 million Nigerians without grid access, with the economic cost of poor supply estimated in the tens of billions of dollars a year."
      - "In the same country, gas is being flared at the wellhead. The energy is present and already at surface. The wires are the thing that is missing."
    contrarian_take: "Almost every argument for why African compute is impossible turns out, when you push on it, to be an argument about transmission. Behind-the-meter compute does not use transmission."
    call_to_action: "That is the entire reason NRG Bloom deploys containers at the wellhead instead of queuing for a grid connection."
    discussion_question: "Name one real constraint on stranded-power compute in Nigeria that is not, underneath, a transmission constraint."
    quote: "Nigeria does not have a power shortage. It has a delivery problem."
    quote_highlights:
      - "shortage"
      - "delivery"
    video_hook: "Nigeria is not short of power. It is short of wires."
    video_close: "Put the compute at the source and the wires stop mattering."
    hashtags:
      - "#Nigeria"
      - "#Africa"
      - "#Energy"
      - "#DataCenters"
      - "#AI"
      - "#NRGBloom"
    fact_ids:
      - "nigeria_grid_delivery_gap"
      - "nigeria_power_access_and_losses"
      - "global_flaring_2024_151bcm"
      - "modular_containerized_model"

  - slug: "bitcoin-to-ai-onramp"
    title: "Bitcoin Mining Is the On-Ramp. It Was Never the Destination."
    publish_day: "Monday (week 2)"
    archetype: "trend-analysis"
    pillar: "energy-to-compute-thesis"
    target_channel: "x-thread"
    audience:
      - "bitcoin mining X"
      - "AI and compute X"
      - "industry validators"
    hero_stat: "53 MW of Nigerian flare-gas capacity was announced in 2025 with the sequence stated out loud: Bitcoin first because it deploys fastest, then AI compute and cloud on the same power."
    hook: "Every serious stranded-power operator runs the same sequence. Mine Bitcoin to prove the megawatts are real. Then rent those megawatts to AI. Nigeria started that sequence early."
    thesis: "Bitcoin is the only compute workload that will move to the power instead of demanding the power move to it, which makes it the cheapest way on earth to commission a remote site."
    proof_points:
      - "Green Flare said it at announcement: Bitcoin first because it is easiest to deploy and monetise, then AI compute and cloud services on the same flare gas."
      - "TeraWulf proved the back half of that sequence in Q1 2026, when HPC lease revenue passed mining revenue at the company for the first time."
      - "Crusoe walked the whole arc: more than 425 modular data centers deployed on stranded gas, then a sale of the mining business to focus on AI infrastructure."
    contrarian_take: "Calling this a pivot misreads it. Mining is not being abandoned. It is being used as the commissioning load that makes a remote site bankable enough to host anything else."
    call_to_action: "NRG Bloom is on that same arc in the Niger Delta, with containers designed to change tenants without changing sites."
    discussion_question: "Is Bitcoin mining best understood as an industry, or as the commissioning load for every megawatt too remote for a grid customer?"
    quote: "Bitcoin is the only workload that will move to the power."
    quote_highlights:
      - "only"
      - "power"
    video_hook: "Mining was never the destination. It is how you prove the megawatts are real."
    video_close: "Same site, same containers, different tenant. That is the whole thesis."
    hashtags:
      - "#Bitcoin"
      - "#AI"
      - "#HPC"
      - "#FlareGas"
      - "#Nigeria"
      - "#NRGBloom"
    fact_ids:
      - "green_flare_ai_compute_roadmap_2025"
      - "green_flare_nigeria_53mw_2025"
